# =============================================================================
# FreeStack self-host stack — Cute Tentacle Cloud City
# =============================================================================
# WHAT THIS IS
#   The always-on, $0 backbone of Operation FreeStack. Runs on Zackary's own
#   server (or Oracle Always Free ARM Ampere). Every service below publishes
#   multi-arch images (amd64 + arm64) — safe for ARM.
#
# PORTS (host:container) — ALL bound to 127.0.0.1 by default (security fix
# 2026-10-05: n8n/Uptime Kuma/Authentik/Infisical all create their admin
# account on first visit — binding to 0.0.0.0 lets anyone on the internet
# claim them before you do). Expose via Pangolin or Tailscale serve/funnel
# when you need remote access; same-box reverse proxies still work.
#   n8n            5678:5678   workflow automation / AI agent glue
#   Uptime Kuma    3001:3001   monitoring + status page
#   Authentik      9000:9000   IdP web UI (http)
#                  9443:9443   IdP web UI (https)
#   Infisical      8080:80     secrets manager UI/API
#   Vaultwarden    8081:80     (COMMENTED OUT — slim/low-RAM alternative to Infisical)
#   SurrealDB      8000:8000   graph/document DB for CuteCity GIS + memory
#   LibreTranslate 5000:5000   self-hosted translation (EN/ES/FR only, to save RAM)
#   SearXNG        8888:8080   private metasearch
#   postgres/redis/mongo are NOT exposed to the host (internal network only).
#   cloudflared (profile: tunnel, OFF by default) opens an outbound-only
#   Cloudflare Tunnel to the edge — the $0 way to reach SurrealDB/n8n/Kuma
#   on your domain with no open ports. See cloudflare-tunnel.md.
#
# RAM ESTIMATE (full stack): ~10-12 GB
#   n8n ~1GB · authentik server+worker ~1.5GB · postgres ~300MB · redis ~100MB
#   mongo ~700MB · infisical ~600MB · surrealdb ~400MB
#   libretranslate ~1.5-2GB (models) · searxng ~300MB · uptime-kuma ~250MB
# SLIM MODE (~5.3 GB worst case): use the override file
#   docker compose -f docker-compose.yml -f docker-compose.slim.yml up -d
# See docker-compose.slim.yml and DEPLOY.md §3.
#
# SECRETS
#   Nothing real is hardcoded here. Copy .env.example to .env and generate:
#     openssl rand -hex 32        # for *_SECRET / *_KEY / *_TOKEN values
#     openssl rand -base64 48     # alternative for tokens
#   Required vars use ${VAR:?message} so compose fails fast with a clear
#   error if you forgot one.
# =============================================================================

name: freestack

services:
  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freestack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-freestack}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-freestack} -d $${POSTGRES_DB:-freestack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [freestack]

  # -------------------------------------------------------------------- redis
  # Shared by authentik (db 0) and infisical (db 2) to save RAM.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Password required (security fix 2026-10-05): shared by authentik+infisical.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (openssl rand -hex 32)}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [freestack]

  # -------------------------------------------------------------------- mongo
  # Only needed for Infisical. Drop entirely in slim mode.
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Root auth required (security fix 2026-10-05). Hex-only passwords: safe in MONGO_URL.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (openssl rand -hex 32)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [freestack]

  # ---------------------------------------------------------------------- n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest # pin to a tested version for production
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:5678/
      GENERIC_TIMEZONE: ${TZ:-America/Vancouver}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336 # hours = 14 days; bounds DB growth
      FREESTACK_ROUTER_KEY: ${ROUTER_KEY:?set me} # must match ROUTER_KEY on the Worker + AI_ROUTER_KEY in GitHub (see key-acquisition-2026-10-05.md §6b)
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [freestack]

  # -------------------------------------------------------------- uptime kuma
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [freestack]

  # ----------------------------------------------------------------- authentik
  authentik-server:
    # Check https://docs.goauthentik.io for the latest tag; bump server+worker together.
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env (openssl rand -hex 32)}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python is guaranteed present in the authentik image; no curl/wget assumed
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/-/health/ready/', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [freestack]

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10 # must match server tag
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_REDIS__PASSWORD: ${REDIS_PASSWORD}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD in .env}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env (openssl rand -hex 32)}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [freestack]

  # ----------------------------------------------------------------- infisical
  # Full secrets manager. Heavy (needs mongo). For the slim stack, comment
  # this service AND mongo out, and uncomment vaultwarden below instead.
  infisical:
    image: infisical/infisical:latest # pin to a tested version for production
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?Set INFISICAL_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      JWT_SIGNUP_SECRET: ${INFISICAL_JWT_SIGNUP_SECRET:?Set INFISICAL_JWT_SIGNUP_SECRET in .env}
      JWT_REFRESH_SECRET: ${INFISICAL_JWT_REFRESH_SECRET:?Set INFISICAL_JWT_REFRESH_SECRET in .env}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD}@mongo:27017/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No app healthcheck: image has no curl/wget/python guaranteed; depends_on covers boot order.
    networks: [freestack]

  # ---------------------------------------------------------------
  # VAULTWARDEN — slim/low-RAM alternative to Infisical (~50MB vs ~1.3GB with mongo).
  # NOTE: now defined for real in docker-compose.slim.yml (the override file).
  # This commented block is kept as reference only — do NOT uncomment it while
  # also using the slim override (they would merge). See DEPLOY.md §3.
  # ---------------------------------------------------------------
  # vaultwarden:
  #   image: vaultwarden/server:latest
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8081:80"
  #   environment:
  #     DOMAIN: ${VAULTWARDEN_DOMAIN:-http://localhost:8081}
  #     ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN in .env (openssl rand -base64 48)}
  #     SIGNUPS_ALLOWED: "false"
  #     INVITATIONS_ALLOWED: "false"
  #   volumes:
  #     - vaultwarden-data:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/alive || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  #   networks: [freestack]

  # ----------------------------------------------------------------- surrealdb
  surrealdb:
    image: surrealdb/surrealdb:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    command: ["start", "--bind", "0.0.0.0:8000", "--user", "root", "--pass", "${SURREAL_PASS:?Set SURREAL_PASS in .env}", "file:/data/freestack.db"]
    volumes:
      - surreal-data:/data
    # No healthcheck: minimal image, no shell guaranteed. Watch `docker compose logs surrealdb`.
    networks: [freestack]

  # ------------------------------------------------------------ libretranslate
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: en,es,fr # only these models = less disk + less RAM
    volumes:
      - libretranslate-data:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      # python guaranteed in image; first boot downloads models (can take minutes)
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 600s
    networks: [freestack]

  # ------------------------------------------------------------------- searxng
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:ro # create settings.yml here first (see DEPLOY.md)
    environment:
      BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
      INSTANCE_NAME: ${SEARXNG_INSTANCE_NAME:-freestack}
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [freestack]

  # --------------------------------------------------------------- cloudflared
  # Cloudflare Tunnel: outbound-only encrypted link from this box to
  # Cloudflare's edge. Exposes SurrealDB / n8n / Uptime Kuma on your domain
  # with NO open ports, no static IP, free DDoS shielding + edge TLS.
  # Honest framing: Workers cannot run a SurrealDB server (no persistent TCP
  # compute on the free tier) — SurrealDB stays on this box; the tunnel is
  # the $0-correct way to reach it. See cloudflare-tunnel.md for the full
  # architecture (what goes behind the tunnel vs what stays Workers-native).
  # Opt-in via the `tunnel` profile: needs CLOUDFLARE_TUNNEL_TOKEN from the
  # Zero Trust dashboard (cloudflare-tunnel.md, "what Zackary does").
  cloudflared:
    image: cloudflare/cloudflared:latest # multi-arch; pin digest after first green deploy
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env — token from the Zero Trust dashboard, see cloudflare-tunnel.md}
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    profiles: ["tunnel"]
    depends_on:
      surrealdb:
        condition: service_started
      n8n:
        condition: service_started
      uptime-kuma:
        condition: service_started
    networks: [freestack]

networks:
  freestack:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  n8n-data:
  kuma-data:
  authentik-media:
  authentik-certs:
  surreal-data:
  libretranslate-data:
  vaultwarden-data: # used only in slim mode (vaultwarden uncommented)
